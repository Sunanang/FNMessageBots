services:
  fn-message-bots:
    build: .
    container_name: fn-message-bots
    restart: unless-stopped
    ports:
      - 18080:18080
    volumes:
      - ./data/logs:/app/data/logs:rw
      - ./data/cursor:/app/data/cursor:rw
      - /usr/trim/var/eventlogger_service:/usr/trim/var/eventlogger_service:ro
      - /usr/trim/var/backup_service:/usr/trim/var/backup_service:ro
      - /usr/local/apps/@appdata/trim.media/database:/usr/local/apps/@appdata/trim.media/database:ro
      - /usr/local/apps/@appdata/trim.photos/db:/usr/local/apps/@appdata/trim.photos/db:ro
      # fn-scheduler 任务计划数据库（路径以实际安装为准，挂载后在 Web 配置页设置 scheduler_db_path）
      # - /usr/local/packages/fn-scheduler/var:/usr/local/packages/fn-scheduler/var:ro
      - ./config:/app/config:rw
    environment:
      - TZ=Asia/Shanghai
